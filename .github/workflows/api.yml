name: api

on:
  push:
    paths:
      - "apps/api/**"
      - "infra/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Start dependencies
        run: docker compose up -d pgsql redis

      - name: Install dependencies
        run: docker compose run --rm -T api composer install --no-interaction --prefer-dist

      - name: Code style
        run: docker compose run --rm -T api php vendor/bin/pint --test

      - name: Test suite
        run: docker compose run --rm -T api php artisan test

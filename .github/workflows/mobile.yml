name: mobile

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      # Versi Flutter di-pin (bukan `channel: stable` yang berpindah tiap rilis):
      # repo dibangun dengan Flutter stable 3.47.4 / Dart 3.13.3 — lihat
      # apps/mobile/README.md §"Prasyarat" dan `flutter --version`.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug

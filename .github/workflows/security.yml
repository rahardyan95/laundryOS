name: security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Composer audit
        run: composer audit --working-dir=apps/api --no-dev --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level high

  filesystem:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # DAST baseline lawan stack dev (T13 go-live): spider pasif + tanpa serangan
  # aktif — aman untuk CI (zaproxy.org/docs/docker/baseline-scan). Gagalkan
  # bila ada temuan FAIL; WARN dilaporkan tanpa menggagalkan.
  zap-baseline:
    name: DAST baseline (ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot API + web stack with seed
        working-directory: infra
        run: |
          docker compose build api web
          docker compose up -d --wait
          docker compose run --rm -T api composer install --no-interaction
          docker compose run --rm -T api php artisan migrate:fresh --seed

      - name: ZAP baseline scan
        run: |
          docker run --rm --network infra_default \
            -v "$PWD:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://web:3000 -t http://api:8000/api/v1/health \
            -m 2 -r zap_baseline.html -J zap_baseline.json || test $? -le 2

      - name: Fail on ZAP FAIL findings
        run: |
          python3 -c "
          import json, sys
          report = json.load(open('zap_baseline.json'))
          fails = [a for s in report.get('site', []) for a in s.get('alerts', []) if a.get('riskcode') == '3']
          print(f'ZAP HIGH findings: {len(fails)}')
          sys.exit(1 if fails else 0)
          "

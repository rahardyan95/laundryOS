name: laundryos

services:
  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE di .env.prod}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME di .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD di .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD di .env.prod}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    # Tag bisa dipatok lewat .env.prod supaya rollback cukup ganti tag
    # (lihat DEPLOY.md §7): API_IMAGE=laundryos-api:2026-09-14.
    image: ${API_IMAGE:-laundryos-api:prod}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      RUN_MIGRATIONS: "1"
      DB_HOST: pgsql
      REDIS_HOST: redis
      # Subnet network `backend` (lihat blok networks di bawah) — satu-satunya
      # pengirim yang X-Forwarded-For-nya boleh dipercaya.
      TRUSTED_PROXIES: "172.28.0.0/16"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  worker:
    # Worker/scheduler selalu memakai tag API yang sama, supaya rollback satu
    # image saja.
    image: ${API_IMAGE:-laundryos-api:prod}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      RUN_MIGRATIONS: "0"
      DB_HOST: pgsql
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  scheduler:
    image: ${API_IMAGE:-laundryos-api:prod}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      RUN_MIGRATIONS: "0"
      DB_HOST: pgsql
      REDIS_HOST: redis
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_MODE: laravel
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL di .env.prod}
        # Aplikasi punya host sendiri (PUBLIC_APP_URL): sitemap/robots Next
        # memakai nilai ini, sedangkan situs pemasaran memakai PUBLIC_SITE_URL.
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL di .env.prod}
    image: ${WEB_IMAGE:-laundryos-web:prod}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  site:
    build:
      context: ../apps/site
      dockerfile: Dockerfile.prod
      # URL dikompilasi ke dalam HTML statis (canonical, sitemap, CTA), jadi
      # build ditolak bila salah satu kosong — tidak ada nilai localhost yang
      # lolos ke produksi.
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL di .env.prod}
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL di .env.prod}
    image: ${SITE_IMAGE:-laundryos-site:prod}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/laundryos.conf:/etc/nginx/conf.d/default.conf:ro
      # Blok 443 (TLS): *.conf di sini dimuat via include wildcard. Direktori
      # boleh kosong sebelum sertifikat terbit.
      - ./nginx/tls:/etc/nginx/conf.d/tls:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - site
    networks: [backend]

  certbot:
    build:
      context: ./certbot
    image: ${CERTBOT_IMAGE:-laundryos-certbot:prod}
    profiles: [tls]
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # Hook deploy me-reload container nginx lewat docker CLI. Socket ini
      # memberi akses tingkat host ke container certbot — kalau tidak mau,
      # hapus mount + --deploy-hook dan reload nginx dari cron di host
      # (DEPLOY.md §5 catatan).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Nama container nginx (turunan `name: laundryos` + service + index).
      NGINX_CONTAINER: ${NGINX_CONTAINER:-laundryos-nginx-1}
    entrypoint: sh
    # Perpanjangan otomatis dua kali sehari + reload nginx saat sertifikat
    # benar-benar diperpanjang (--deploy-hook).
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook /usr/local/bin/reload-nginx.sh; sleep 12h & wait $${!}; done"

networks:
  backend:
    ipam:
      config:
        # Subnet tetap supaya TRUSTED_PROXIES bisa menyebutnya dengan pasti.
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  redisdata:
  certbot-www:

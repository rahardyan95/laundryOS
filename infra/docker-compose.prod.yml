name: laundryos

services:
  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE di .env.prod}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME di .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD di .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD di .env.prod}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.prod
    image: laundryos-api:prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      RUN_MIGRATIONS: "1"
      DB_HOST: pgsql
      REDIS_HOST: redis
      # Subnet network `backend` (lihat blok networks di bawah) — satu-satunya
      # pengirim yang X-Forwarded-For-nya boleh dipercaya.
      TRUSTED_PROXIES: "172.28.0.0/16"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  worker:
    image: laundryos-api:prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      RUN_MIGRATIONS: "0"
      DB_HOST: pgsql
      REDIS_HOST: redis
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  scheduler:
    image: laundryos-api:prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      RUN_MIGRATIONS: "0"
      DB_HOST: pgsql
      REDIS_HOST: redis
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_MODE: laravel
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL di .env.prod}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL di .env.prod}
    image: laundryos-web:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      api:
        condition: service_started
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/laundryos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks: [backend]

  certbot:
    image: certbot/certbot:latest
    profiles: [tls]
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

networks:
  backend:
    ipam:
      config:
        # Subnet tetap supaya TRUSTED_PROXIES bisa menyebutnya dengan pasti.
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  redisdata:
  certbot-www:

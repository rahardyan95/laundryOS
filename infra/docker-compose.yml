services:
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laundry
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pgsql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ../apps/api
    volumes:
      - ../apps/api:/var/www
      - ./api-entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "8000:8000"
    entrypoint: ["/entrypoint.sh"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: laundry
      DB_USERNAME: laundry
      DB_PASSWORD: laundry
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Dipakai untuk CORS, tautan reset, dan sesi SPA. Ditaruh di compose agar
      # klon bersih tidak bergantung pada .env lokal developer.
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3100
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:3100,127.0.0.1:3000,127.0.0.1:3100
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  worker:
    build: ../apps/api
    volumes:
      - ../apps/api:/var/www
      - ./api-entrypoint.sh:/entrypoint.sh:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: laundry
      DB_USERNAME: laundry
      DB_PASSWORD: laundry
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3100
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:3100,127.0.0.1:3000,127.0.0.1:3100
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3"]

  scheduler:
    build: ../apps/api
    volumes:
      - ../apps/api:/var/www
      - ./api-entrypoint.sh:/entrypoint.sh:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: laundry
      DB_USERNAME: laundry
      DB_PASSWORD: laundry
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3100
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:3100,127.0.0.1:3000,127.0.0.1:3100
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/entrypoint.sh"]
    command: ["php", "artisan", "schedule:work"]

volumes:
  pgdata:

# Reverse proxy LaundryOS: web (Next) di "/" dan API (PHP-FPM) di /api, /sanctum, /up.
# TLS: aktifkan blok server 443 setelah sertifikat Let's Encrypt tersedia
# (lihat infra/DEPLOY.md).

server {
    listen 80;
    server_name _;

    client_max_body_size 8M;

    # Verifikasi ACME untuk certbot (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API (Laravel via PHP-FPM) ---
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        # Nginx adalah satu-satunya titik masuk, jadi header kiriman klien dibuang:
        # tanpa ini klien bisa memalsukan IP-nya dan melewati rate limit login/track.
        # Bila nanti ada CDN/LB di depan, pasang real_ip_module lalu ganti $remote_addr
        # dengan $realip_remote_addr.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    # --- Web (Next.js standalone) ---
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}


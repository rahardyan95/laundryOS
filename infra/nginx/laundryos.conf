# Reverse proxy LaundryOS: satu edge nginx untuk dua host.
#
#   host aplikasi (default server — cocok untuk Host apa pun, termasuk IP VPS):
#       /                     -> web  (Next.js standalone :3000)
#       /api, /sanctum, /up   -> api  (Laravel via PHP-FPM :9000)
#   host situs publik (daftar `server_name` di blok kedua; samakan dengan
#   PUBLIC_SITE_URL saat build):
#       /                     -> site (nginx statis berisi hasil build apps/site)
#
# Berkas ini sengaja tetap bisa jalan dengan HTTP saja: deploy pertama harus
# mungkin sebelum sertifikat terbit. Blok 443 dimuat dari nginx/tls/*.conf
# (lihat infra/DEPLOY.md §5) sehingga mengaktifkan TLS tidak perlu menyunting
# berkas ini.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 8M;

    # Verifikasi ACME untuk certbot (webroot). Wajib tetap ada dan tetap
    # dilayani di port 80 walau redirect di bawah sudah diaktifkan.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API (Laravel via PHP-FPM) ---
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        # Nginx adalah satu-satunya titik masuk, jadi header kiriman klien dibuang:
        # tanpa ini klien bisa memalsukan IP-nya dan melewati rate limit login/track.
        # Bila nanti ada CDN/LB di depan, pasang real_ip_module lalu ganti $remote_addr
        # dengan $realip_remote_addr.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    # --- Web (Next.js standalone) ---
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Redirect HTTP -> HTTPS: uncomment SATU baris di bawah setelah sertifikat
    # terbit (DEPLOY.md §5 langkah 4). Setelah aktif, location /api dan / di atas
    # tidak lagi terpakai (semua trafik pindah ke 443) dan boleh dibiarkan.
    # Jangan diganti dengan `return 301 ...;` telanjang di level server: `return`
    # di server context berjalan SEBELUM pemilihan location, sehingga permintaan
    # /.well-known/acme-challenge/ ikut ter-redirect dan certbot tidak bisa
    # memperpanjang sertifikat (sudah diuji: nginx 1.27 mengembalikan 301 untuk
    # path ACME pada bentuk itu).
    # if ($request_uri !~ "^/\.well-known/acme-challenge/") { return 301 https://$host$request_uri; }
}

# --- Situs pemasaran (apps/site) ---
# Host terpisah supaya "/" di host aplikasi tetap milik dashboard. Isi daftar
# server_name dengan PUBLIC_SITE_URL saat build, dan sertakan host yang sama di
# perintah certbot (`-d`). Blok 443-nya ada di nginx/tls/laundryos-ssl.conf.
server {
    listen 80;
    server_name laundryos.example www.laundryos.example;

    client_max_body_size 8M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://site:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Lihat penjelasan di blok aplikasi: satu baris ini yang di-uncomment
    # setelah sertifikat terbit.
    # if ($request_uri !~ "^/\.well-known/acme-challenge/") { return 301 https://$host$request_uri; }
}

# Blok 443 (TLS) dimuat dari direktori terpisah supaya ada/tidaknya sertifikat
# tidak mengubah berkas ini. Salin nginx/tls/laundryos-ssl.conf.example ke
# nginx/tls/laundryos-ssl.conf dengan domain asli (DEPLOY.md §5). Include
# wildcard ini aman walau direktori kosong.
include /etc/nginx/conf.d/tls/*.conf;

# Reverse proxy untuk API LaundryOS (produksi).
# Ganti server_name dan path SSL sesuai domain. Jalankan di container Nginx
# pada network compose yang sama dengan service `api` (php-fpm :9000).

upstream laundryos_api {
    server api:9000;
}

server {
    listen 80;
    server_name api.example.com;

    # Redirect ke HTTPS bila TLS dikonfigurasi (uncomment setelah certbot).
    # return 301 https://$host$request_uri;

    root /var/www/public;
    index index.php;
    client_max_body_size 8M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass laundryos_api;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

name: laundryos_mobile
description: LaundryOS mobile — owner, staf, dan kurir.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  sentry_flutter: ^9.30.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    # Plus Jakarta Sans (lisensi OFL 1.1, lihat assets/fonts/OFL.txt) — sama
    # dengan web (DESIGN.md §2). Satu variable font: berat dipilih lewat
    # `fontWeight`, dipetakan Flutter ke sumbu `wght`.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Halaman 404 hasil build Astro (dist/404.html) dipakai untuk path yang
    # tidak ada, termasuk /404. Tanpa ini nginx menampilkan halaman 404 bawaan.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
